name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Reassemble video files
        run: python3 assemble.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id') || artifact=""
            if [ -n "$artifact" ]; then
              sleep 15
              exit 0
            fi
            sleep 5
          done
          echo "The Pages deployment artifact is unavailable." >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
